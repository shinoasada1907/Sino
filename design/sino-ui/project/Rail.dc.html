<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"active":{"editor":"enum","options":["overview","inbox","calendar","tasks","notes","accounts","services","registrations","settings"],"default":"overview"},"$preview":{"width":72,"height":1194}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const active = this.props.active || 'overview';
    const cls = {};
    const cur = {};
    ['overview', 'inbox', 'calendar', 'tasks', 'notes', 'accounts', 'services', 'registrations', 'settings'].forEach((key) => {
      cls[key] = key === active ? 'rail-item is-active' : 'rail-item';
      cur[key] = key === active ? 'page' : undefined;
    });
    return { rootClass: `sino theme-${theme} rail`, cls, cur };
  }
}
</script>
