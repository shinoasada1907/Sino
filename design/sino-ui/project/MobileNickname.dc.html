<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sino · Mobile · đặt biệt danh</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sino.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}">
<header class="mob-top" style="gap: 8px; padding-left: 4px; border-bottom: 1px solid var(--border);">
<a class="btn btn-ghost btn-icon" href="MobileMessages.dc.html" aria-label="Quay lại Tin nhắn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span class="avatar av-c" aria-hidden="true"></span>
<div class="who-text" style="flex-grow: 1;">
<h1 class="t-small" style="margin: 0; font-weight: 600;"><button type="button" aria-haspopup="dialog" aria-label="{{nameLabel}}" onClick="{{openDialog}}" style="appearance: none; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; margin: -4px -6px; padding: 4px 6px; border: 0; border-radius: var(--r-sm); background: transparent; color: inherit; font: inherit; cursor: pointer;">{{shownName}}<svg class="ic ic-16 c-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></button></h1>
<span class="spec ellipsis">{{subline}}</span>
</div>
<button class="btn btn-ghost btn-icon" type="button" aria-label="Thông tin cuộc trò chuyện"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></button>
</header>
<main class="mob-chat">
<span class="day-sep" style="align-self: center; padding: 4px 0 0;">HÔM NAY</span>
<div class="bubble-row"><span class="avatar av-c avatar-sm" aria-hidden="true"></span><div class="bubble-col"><div class="bubble">Chị ơi tối nay em qua lấy đồ nhé.</div><span class="bubble-meta">07:52</span></div></div>
<div class="bubble-row out"><div class="bubble-col"><div class="bubble">Ừ, chị để ở bàn ngoài cho em.</div><span class="bubble-meta">07:55 · Đã xem</span></div></div>
</main>
<div class="mob-composer">
<div class="composer-box"><label class="sr" for="mob-nick-msg">Nhắn tin tới {{shownName}}</label><textarea id="mob-nick-msg" rows="1" placeholder="Nhắn tin…"></textarea></div>
<button class="btn btn-primary btn-icon" type="button" aria-label="Gửi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg></button>
</div>

<sc-if value="{{open}}" hint-placeholder-val="{{false}}"><div class="sheet-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Đặt biệt danh">
<span class="sheet-grab" aria-hidden="true"></span>
<div class="sheet-bar">
<button class="btn btn-ghost btn-sm" type="button" onClick="{{closeDialog}}" style="justify-self: start;">Hủy</button>
<h2 class="t-small" style="margin: 0; font-weight: 600;">Đặt biệt danh</h2>
<sc-if value="{{is.error}}" hint-placeholder-val="{{false}}"><button class="btn btn-primary btn-sm" type="button">Lưu</button></sc-if>
<sc-if value="{{saveOff}}" hint-placeholder-val="{{false}}"><button class="btn btn-primary btn-sm" type="button" disabled="disabled">Lưu</button></sc-if>
</div>
<div class="sheet-form">
<div class="field">
<label class="field-label" for="m-nick-input">Biệt danh</label>
<sc-if value="{{is.empty}}" hint-placeholder-val="{{false}}"><input class="input is-focus" id="m-nick-input" type="text" maxlength="50" placeholder="Ví dụ: Em Hà" defaultValue=""></sc-if>
<sc-if value="{{is.set}}" hint-placeholder-val="{{false}}"><input class="input is-focus" id="m-nick-input" type="text" maxlength="50" placeholder="Ví dụ: Em Hà" defaultValue="Em Hà"></sc-if>
<sc-if value="{{is.error}}" hint-placeholder-val="{{false}}"><input class="input is-invalid is-focus" id="m-nick-input" type="text" maxlength="50" aria-invalid="true" aria-describedby="m-nick-error" defaultValue="Em gái"></sc-if>
<sc-if value="{{is.error}}" hint-placeholder-val="{{false}}"><span class="field-error" id="m-nick-error" role="alert"><svg class="ic ic-16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>Zalo không cho đặt biệt danh cho người này.</span></sc-if>
<span class="field-help">Tên Zalo: Nguyễn Thu Hà · tối đa 50 ký tự</span>
</div>
</div>
<sc-if value="{{hasNickname}}" hint-placeholder-val="{{false}}"><div class="sheet-sep"></div><button class="sheet-item" type="button" style="color: var(--danger-ink);"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--danger-ink);"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg><span>Xóa biệt danh</span><span></span></button></sc-if>
<p class="sheet-foot" style="margin: 0;">Biệt danh được đặt trong Zalo của bạn, nên cũng hiện trên điện thoại. Chỉ bạn thấy.</p>
</div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"dialog":{"editor":"enum","options":["closed","empty","set","error"],"default":"set"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const s = this.state || {};
    const states = ['closed', 'empty', 'set', 'error'];
    const picked = states.includes(this.props.dialog) ? this.props.dialog : 'set';
    const open = s.open === undefined ? picked !== 'closed' : s.open;
    const kind = picked === 'closed' ? 'set' : picked;
    const hasNickname = picked !== 'empty';
    const shownName = hasNickname ? 'Em Hà' : 'Nguyễn Thu Hà';
    return {
      rootClass: `sino theme-${theme} mob`,
      open,
      is: { empty: kind === 'empty', set: kind === 'set', error: kind === 'error' },
      hasNickname,
      saveOff: kind !== 'error',
      shownName,
      subline: hasNickname ? 'Zalo · Nguyễn Thu Hà' : 'Zalo · An Nguyễn',
      nameLabel: `${shownName}, đặt biệt danh`,
      openDialog: () => this.setState({ open: true }),
      closeDialog: () => this.setState({ open: false }),
    };
  }
}
</script>
</body>
</html>
