</main>
<dc-import name="TabBar" theme="{{theme}}" active="more" hint-size="390px,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const pick = (this.state && this.state.look) || 'system';
    const looks = [
      { id: 'system', label: 'Hệ thống' },
      { id: 'dark', label: 'Tối' },
      { id: 'light', label: 'Sáng' },
    ].map((l) => ({ ...l, pressed: l.id === pick, pick: () => this.setState({ look: l.id }) }));
    return { theme, rootClass: `sino theme-${theme} mob`, looks };
  }
}
</script>
