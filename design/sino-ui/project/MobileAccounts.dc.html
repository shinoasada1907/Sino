<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sino · Mobile · Tài khoản</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sino.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}">
<header class="mob-top has-back"><a class="btn btn-ghost btn-icon" href="MobileMore.dc.html" aria-label="Quay lại Thêm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div class="mob-title"><h1 class="t-small" style="font-weight: 600;">Tài khoản</h1><span class="spec ellipsis">3 TÀI KHOẢN · 1 CẦN XỬ LÝ</span></div><button class="btn btn-ghost btn-icon" type="button" aria-label="Thêm tài khoản"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button></header>
<main class="mob-scroll dotbg" style="gap: 16px; padding-top: 16px;">
<nav class="list-group" aria-label="Tài khoản đã kết nối">
<a class="list-group-item is-col" href="#gmail" style="grid-template-columns: 36px minmax(0, 1fr) auto;"><span class="avatar av-a"><span class="sub"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span></span><div class="who-text"><span class="t-small" style="font-weight: 600;">Gmail</span><span class="spec ellipsis">an.nguyen@gmail.com</span></div><span class="status"><span class="dot dot-ok"></span>Ổn định</span></a>
<a class="list-group-item is-col" href="#zalo" style="grid-template-columns: 36px minmax(0, 1fr) auto;"><span class="avatar av-a"><span class="sub"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span></span><div class="who-text"><span class="t-small" style="font-weight: 600;">Zalo</span><span class="spec ellipsis">+84 9•• ••• 218</span><span class="progress" role="img" aria-label="Đã đồng bộ 64%" style="margin-top: 4px;"><span style="width: 64%;"></span></span></div><span class="status"><span class="dot dot-warn"></span>64%</span></a>
<a class="list-group-item is-col" href="MobileAccountDetail.dc.html" style="grid-template-columns: 36px minmax(0, 1fr) auto;"><span class="avatar av-b"><span class="sub"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path><path d="m8 13 3-3 2.5 2L16 9.5"></path></svg></span></span><div class="who-text"><span class="t-small" style="font-weight: 600;">Messenger</span><span class="t-small ink-err ellipsis">Quyền hết hạn từ 21:04 hôm qua</span></div><span class="gap-row" style="gap: 6px; flex-wrap: nowrap;"><span class="dot dot-err"></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></a>
</nav>
<button class="btn btn-secondary" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Kết nối tài khoản</button>
<p class="why" style="padding: 0 4px;">Mỗi tài khoản đồng bộ riêng. Thông tin đăng nhập được mã hóa trước khi lưu.</p>
</main>
<dc-import name="TabBar" theme="{{theme}}" active="more" hint-size="390px,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    return { theme, rootClass: `sino theme-${theme} mob`, yes: true };
  }
}
</script>
</body>
</html>
