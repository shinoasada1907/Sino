<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sino Sunset · Trò chuyện di động</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./sunset.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="sn theme-{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); font-size: 14px; overflow: hidden;">
  <header style="height: 64px; padding: 0 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); background: var(--surface);">
    <a href="#" class="icon-btn" aria-label="Quay lại" style="width: 44px; height: 44px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span class="av a4">GĐ<span class="pv zalo">Z</span></span>
    <div style="display: flex; flex-direction: column; line-height: 1.25; min-width: 0;"><span style="font-weight: 600;">Gia đình</span><span class="tiny ink">Mẹ đang nhập…</span></div>
    <button class="icon-btn" aria-label="Tạo task từ cuộc trò chuyện" style="margin-left: auto; width: 44px; height: 44px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7H4V5h11"/></svg></button>
  </header>
  <div style="flex: 1; overflow: hidden; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end;">
    <div style="align-self: center;" class="tag">Hôm nay</div>
    <div style="display: flex; flex-direction: column; gap: 3px;"><span class="tiny subtle" style="padding-left: 4px;">Bố</span><div class="bubble theirs" style="max-width: 80%;">Tuần này ai về được thì báo bố mẹ nhé.</div></div>
    <div class="bubble mine" style="max-width: 80%;">Con về được, tầm 18:30 ạ.</div>
    <div style="display: flex; flex-direction: column; gap: 3px;"><span class="tiny subtle" style="padding-left: 4px;">Mẹ</span><div class="bubble theirs" style="max-width: 80%;">Cuối tuần này cả nhà về ăn cơm nhé, nhớ mua bánh cho bà.</div></div>
    <div class="card" style="padding: 12px; display: flex; align-items: center; gap: 10px; border-radius: 14px; margin: 4px 0;">
      <span class="check" aria-hidden="true"></span>
      <div style="flex: 1; min-width: 0;"><div class="trunc" style="font-weight: 500;">Mua bánh bông lan trứng muối</div><div class="tiny subtle">Sino gợi ý từ tin nhắn của Mẹ</div></div>
      <button class="btn primary" style="height: 32px;">Thêm</button>
    </div>
    <div class="bubble mine" style="max-width: 80%;">Dạ, con ghi lại rồi ạ.</div>
  </div>
  <div style="padding: 8px 12px 28px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 6px;">
    <button class="icon-btn" aria-label="Đính kèm" style="width: 44px; height: 44px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <div style="flex: 1; height: 42px; border-radius: 21px; background: var(--raised); border: 1px solid var(--border); display: flex; align-items: center; padding: 0 14px;" class="muted">Nhắn tin…</div>
    <button class="btn primary" aria-label="Gửi" style="width: 44px; height: 44px; padding: 0; border-radius: 22px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme === 'light' ? 'light' : 'dark' };
  }
}
</script>
</body>
</html>
