<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sino Sunset · Tin nhắn tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./sunset.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="sn theme-{{theme}}" style="width: 1024px; height: 900px; display: flex; background: var(--bg);">
  <nav class="pane" aria-label="Điều hướng chính" style="width: 64px; flex: 0 0 64px; height: 876px; padding: 14px 0; gap: 8px; align-items: center;">
    <div class="sun" aria-hidden="true" style="margin-bottom: 8px;"></div>
    <a href="#" class="icon-btn" aria-label="Tổng quan"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></a>
    <a href="#" class="icon-btn tint" aria-label="Tin nhắn" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg></a>
    <a href="#" class="icon-btn" aria-label="Hộp thư"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8M3 13v6h18v-6M3 13h5l1 3h6l1-3h5"/></svg></a>
    <a href="#" class="icon-btn" aria-label="Lịch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></svg></a>
  </nav>

  <section class="pane" aria-label="Cuộc trò chuyện" style="flex: 0 0 360px; height: 876px;">
    <div style="padding: 16px 14px 10px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <h1 class="h2" style="font-size: 17px;">Tin nhắn</h1>
      </div>
      <label for="acc-pick" style="display: flex; flex-direction: column; gap: 4px;">Tài khoản
        <button id="acc-pick" class="btn" aria-haspopup="listbox" style="justify-content: flex-start; width: 100%;"><span class="dot" style="color: var(--text-subtle);" aria-hidden="true"></span><span style="flex: 1; text-align: left;">Tất cả tài khoản</span><span class="tag accent" style="height: 20px; padding: 0 7px;">5</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </label>
      <div style="display: flex; align-items: center; gap: 6px;">
        <div class="seg" role="tablist" aria-label="Lọc" style="flex: 1;">
          <button class="on" role="tab" aria-selected="true" style="flex: 1; padding: 0 8px;">Tất cả</button>
          <button role="tab" aria-selected="false" style="flex: 1; padding: 0 8px;">Chưa đọc 5</button>
          <button role="tab" aria-selected="false" style="flex: 1.3; padding: 0 8px;">Cần trả lời 2</button>
        </div>
        <button class="btn ghost" aria-haspopup="menu" style="height: 38px; padding: 0 10px;">Thêm</button>
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="tag solid" aria-pressed="true" style="border: 0; font: inherit; font-size: 12px; font-weight: 700;">Mọi chat</button>
        <button class="tag" aria-pressed="false" style="border: 0; font: inherit; font-size: 12px; font-weight: 700;">Cá nhân</button>
        <button class="tag" aria-pressed="false" style="border: 0; font: inherit; font-size: 12px; font-weight: 700;">Nhóm</button>
      </div>
    </div>
    <div style="flex: 1; overflow: auto; padding: 0 8px 12px;">
      <sc-for list="{{chats}}" as="c" hint-placeholder-count="5">
        <a href="#" class="{{c.cls}}" style="align-items: center;">
          <span class="av {{c.av}}">{{c.ini}}<span class="pv {{c.pv}}">{{c.pl}}</span></span>
          <div style="flex: 1; min-width: 0;">
            <div style="display: flex; gap: 8px;"><span class="who trunc">{{c.who}}</span><span class="subtle small" style="margin-left: auto;">{{c.time}}</span></div>
            <div class="tiny subtle trunc">{{c.label}}</div>
            <div class="muted small trunc">{{c.last}}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </section>

  <section class="main" aria-label="Chưa chọn cuộc trò chuyện" style="height: 900px; align-items: center; justify-content: center;">
    <p class="muted">Chọn một cuộc trò chuyện để đọc.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1024,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (av, ini, pv, pl, who, label, time, last, n) => ({ av, ini, pv, pl, who, label, time, last, cls: 'row' + (n ? ' unread' : '') });
    const chats = [
      c('a4', 'GĐ', 'zalo', 'Z', 'Gia đình', 'An · Công việc · nhóm 6 người', '08:15', 'Mẹ: Nhớ mua bánh cho bà nhé', true),
      c('a3', 'LH', 'zalo', 'Z', 'Lê Hoàng', 'An Nguyễn', '07:52', 'Ok, mai mình gửi file thiết kế bản cuối', true),
      c('a2', 'TT', 'zalo', 'Z', 'Thu Trang', 'An Nguyễn', 'Hôm qua', 'Bạn: Ảnh đẹp quá, gửi nốt nhé', false),
      c('a5', 'DA', 'tele', 'T', 'Dev Sài Gòn', '@an.nguyen · nhóm 24 người', 'Hôm qua', 'Quang: PR đã merge rồi mọi người', false),
      c('a1', 'MA', 'zalo', 'Z', 'Trần Minh Anh', 'An · Công việc', 'Thứ 4', 'Em gửi anh file hợp đồng qua mail rồi ạ', false)
    ];
    return { theme: this.props.theme === 'dark' ? 'dark' : 'light', chats };
  }
}
</script>
</body>
</html>
