spring:
  application:
    name: sino-api
  datasource:
    # No defaults on purpose: outside the `local` profile the environment must provide these.
    url: ${SINO_DB_URL}
    username: ${SINO_DB_USERNAME}
    password: ${SINO_DB_PASSWORD}
  jpa:
    # Transactions and the persistence context end in the application service, not in the web layer.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # Everything else (env, configprops, heapdump...) stays unreachable over HTTP.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Anonymous callers only see the overall status; the API user also sees the components.
      show-details: when-authorized
      group:
        readiness:
          # Ready only when the database answers. Liveness deliberately ignores the database.
          include: readinessState,db

server:
  servlet:
    session:
      # D-22: the browser session ends after 30 minutes without a request; "keep me signed in" (D-34) outlives it.
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # Set to true behind HTTPS so the cookie is never sent over plain HTTP.
        secure: ${SINO_SESSION_COOKIE_SECURE:false}

sino:
  owner:
    # D-10: the single Sino user of the MVP, upserted by email at startup. Required.
    email: ${SINO_OWNER_EMAIL:}
    display-name: ${SINO_OWNER_DISPLAY_NAME:}
    # D-33: the login password of the owner, at least 12 characters. Only a BCrypt hash is kept after startup.
    password: ${SINO_OWNER_PASSWORD:}
  auth:
    # D-34: signs the remember-me cookie, at least 32 characters (openssl rand -base64 32). Changing it signs
    # everybody out of "keep me signed in".
    remember-me-key: ${SINO_REMEMBER_ME_KEY:}
  credentials:
    encryption:
      # D-11: AES-256-GCM keys, base64 of 32 random bytes (openssl rand -base64 32). Values only come from the
      # environment. To rotate, add a slot such as k2: ${SINO_CREDENTIAL_KEY_K2:} and make it the active key.
      active-key-id: ${SINO_CREDENTIAL_ACTIVE_KEY_ID:}
      keys:
        k1: ${SINO_CREDENTIAL_KEY_K1:}
