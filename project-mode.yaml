# commits each task, then reports and stops. Architecture decisions stay with the user; `new_features` and
# `task_overrides` below still hold until the user changes them.
# 2026-10-15, morning (user): the agent implements only when the user sets `mode: AUTO`. In TRAINING and HYBRID the user
# codes, tests and debugs every task. The agent splits the work into small steps and gives, for each step, the code
# to type (only the new code, with its exact insertion point, explained) and a detailed step-by-step test and debug
# guide. It does not run the code first in a sandbox, build, run tests, write docs, update PROJECT_STATE/tasks.md
# or commit, unless the user asks for that one action. In AUTO it does the work itself and follows the full process.
# Areas not listed below follow `default`.
default: AUTO
